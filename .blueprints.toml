[repo]
# The repo's channel takes this name too; the seats talk in agent-chat and announcements (D104).
id = "just-vcf"
# The forge gate checks every gh write against .leak_words and for absolute paths. Since kit v0.1.93
# (#162) it checks only seated sessions unless this is set; here a private genome's names are the one
# thing that must not leave, so an unseated session's issue or comment is checked too.
forge_gate_unseated = true

[seat.triage]
# Answers consumer feedback (docs/seats/TRIAGE.md). The lead and the liaison relay a consumer report to
# it; the tooling seat, a change to a loop script; a desk's secretary relays the person's answers.
wake_from = "just-vcf/lead just-vcf/upstream-liaison just-vcf/tooling */secretary"

[seat.triage.watch.inbox]
# One line when docs/FEEDBACK.md differs from HEAD and has settled (150 s unchanged), said once per
# state, a restart included; paused off the remote's default branch. The kit's watcher (#76): the
# command is the tooling seat's, the line triage's.
cmd = "sh kit:drivers/git/watch-file.sh docs/FEEDBACK.md"

[seat.triage.watch.inbox-commits]
# One line when a commit to docs/FEEDBACK.md lands on origin's main that this clone's main does not
# hold: a report committed elsewhere, which watch-file.sh cannot see (the file then matches HEAD). The
# kit's trunk watcher, as its triage runbook sets it up; commits already in the local branch, such as
# triage's own in this checkout, are not said.
cmd = "sh kit:drivers/git/watch-remote.sh --path docs/FEEDBACK.md"

# The desk's answers to this seat's questions, each said once (D133); the desk files this repo's
# questions under repo:just-vcf.
[seat.triage.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py just-vcf triage"

[seat.triage.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

[seat.upstream-liaison]
# Owns what is known about polars-bio and the layers under it (docs/seats/UPSTREAM_LIAISON.md). Triage
# and the lead hand it an upstream symptom; a desk's secretary relays the person's go for a filing.
wake_from = "just-vcf/triage just-vcf/lead just-vcf/tooling */secretary"

# The desk's answers to this seat's questions, each said once (D133); the desk files this repo's
# questions under repo:just-vcf.
[seat.upstream-liaison.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py just-vcf upstream-liaison"

[seat.upstream-liaison.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

[seat.lead]
# The person's own coding sessions here (docs/seats/LEAD.md): the roadmap, the design, the build.
# Triage hands it a fix too big for a pass; the liaison, a mitigation to change at a pin bump.
wake_from = "just-vcf/triage just-vcf/upstream-liaison just-vcf/tooling */secretary"

# The desk's answers to this seat's questions, each said once (D133); the desk files this repo's
# questions under repo:just-vcf.
[seat.lead.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py just-vcf lead"

# The plan's items that need the lead (the kit's D116, RM62): no state or owner, a waits-until date come, a
# blocked item with no desk question, a desk question answered, and the person leaving with unattended items.
# Reads the **State:** line every RM item opens with (ea6a199). Hourly; each said once.
[seat.lead.watch.plan]
cmd = "sh kit:bin/py.sh kit:classes/lead/plan-watch.py --plan docs/ROADMAP.md"

[seat.lead.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

[seat.tooling]
# Owns the machinery (docs/seats/TOOLING.md): the triage loop's scripts, the watcher commands, the leak
# gate's install, the kit's pin. Every seat here brings it a tool's fault; the kit's tooling seat may
# reach it about an issue it filed there.
wake_from = "just-vcf/triage just-vcf/upstream-liaison just-vcf/lead agents-kit/tooling */secretary"

# This repository's issues, where its tool requests live: each event a line.
[seat.tooling.watch.issues]
cmd = "sh kit:bin/py.sh kit:drivers/github/watch-issues.py --origin"

# The desk's answers to this seat's questions, each said once (D133); the desk files this repo's
# questions under repo:just-vcf.
[seat.tooling.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py just-vcf tooling"

[seat.tooling.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"
