[project]
name = "just-vcf"
version = "0.1.0"
description = "Polars-bio based conversion of consumer and personal genomics files into VCF"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "winternewt", email = "isoutthere@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gtars>=0.10.0",
    "platformdirs>=4.11",
    "polars-bio>=0.36.0",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2",
    "refget>=0.12.0",
    "typer>=0.27",
]

[project.scripts]
just-vcf = "just_vcf.cli:app"

[project.optional-dependencies]
# pysam backs the FASTA tier of REF lookup (faidx). It has no Windows wheels, so it
# carries the platform marker; Windows users who need FASTA lookup should use WSL/Linux.
# Imported behind a guarded module-level try/except with an install hint.
reference = [
    "pysam>=0.24.0 ; sys_platform != 'win32'",
]
# pyliftover is pure Python and installs everywhere; coordinate liftover only.
liftover = [
    "pyliftover>=0.4.1",
]
# numpy for the ancestry PCA projection and KNN.
ancestry = [
    "numpy>=2.5,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/just_vcf"]

# An allow-list, never hatchling's default (every file git does not ignore): docs/ holds documents
# derived from private genomes and the root holds agent and team files, none of which may reach PyPI.
# tests/test_package.py builds both artifacts and fails on anything else.
[tool.hatch.build.targets.sdist]
only-include = ["src/just_vcf", "pyproject.toml", "README.md", "LICENSE"]

[dependency-groups]
# httpx is dev-only: the PGP-HMS sample leecher is a script in scripts/, not a library feature.
dev = [
    "ga4gh-vrs>=2.3",
    "httpx>=0.28",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Only this repo's suite: data/ can hold clones of upstream repos with their own tests.
testpaths = ["tests"]
