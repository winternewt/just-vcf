[project]
name = "just-vcf"
version = "0.1.0"
description = "Load consumer and personal genomics files (array exports, genotype tables, VCF and gVCF) and write them as VCF, on polars-bio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "winternewt", email = "isoutthere@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["vcf", "gvcf", "genomics", "genotype", "23andme", "polars", "polars-bio", "vrs", "liftover"]
# No License classifier: `license` is an SPDX expression (PEP 639), which replaces it.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "gtars>=0.10.0",
    "platformdirs>=4.11",
    "polars-bio>=0.37.0",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2",
    "refget>=0.12.0",
    "typer>=0.27",
]

[project.scripts]
just-vcf = "just_vcf.cli:app"

[project.optional-dependencies]
# `reference` and `liftover` are kept though no code imports pysam or pyliftover any more (REF is
# read from gtars' refget store, liftover runs in polars): desk #160's term ended on keeping them,
# 2026-11-26. pysam has no Windows wheels, hence the marker.
reference = [
    "pysam>=0.24.0 ; sys_platform != 'win32'",
]
liftover = [
    "pyliftover>=0.4.1",
]
# numpy for the ancestry PCA projection and KNN.
ancestry = [
    "numpy>=2.5,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/just_vcf"]

# An allow-list, never hatchling's default (every file git does not ignore): docs/ holds documents
# derived from private genomes and the root holds agent and team files, none of which may reach PyPI.
# tests/test_package.py builds both artifacts and fails on anything else.
[tool.hatch.build.targets.sdist]
only-include = ["src/just_vcf", "pyproject.toml", "README.md", "LICENSE"]

[dependency-groups]
# httpx is dev-only: the PGP-HMS sample leecher is a script in scripts/, not a library feature.
dev = [
    "ga4gh-vrs>=2.3",
    "httpx>=0.28",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Only this repo's suite: data/ can hold clones of upstream repos with their own tests.
testpaths = ["tests"]
